<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Celtics Draft Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{font-family:system-ui;background:#0c2340;height:100%;width:100%;overflow:hidden}
body{display:flex}
.app{display:flex;flex-direction:column;height:100vh;width:100%;background:#f0f2f5}
.header{background:linear-gradient(135deg,#0c2340 0%,#1a3a52 100%);color:white;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0}
.header h1{font-size:1.3em;margin-bottom:8px;font-weight:700}
.stats{display:flex;gap:20px;background:rgba(255,255,255,.1);padding:8px 12px;border-radius:6px;text-align:center}
.stat{flex:1}
.stat-val{font-size:1.2em;font-weight:700}
.stat-label{font-size:.75em;opacity:.9;margin-top:2px}
.tabs{display:flex;background:white;border-bottom:1px solid #ddd;flex-shrink:0}
.tab{flex:1;padding:12px;border:none;background:white;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;color:#666;font-size:.95em;transition:.2s}
.tab.active{color:#0c2340;border-bottom-color:#0c2340;background:#f5f5f5}
.tab:active{background:#ebebeb}
.list{flex:1;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch}
.game{background:white;padding:12px;margin-bottom:8px;border-radius:8px;border-left:4px solid #FFD700;display:flex;gap:10px;align-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.game.clickable{cursor:pointer}
.game.clickable:active{transform:scale(0.98);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.game.picked{background:#e8e8e8;opacity:.6}
.game.picked .team{text-decoration:line-through;color:#999}
.game.gold{border-left-color:#FFD700}
.game.orange{border-left-color:#FF8C00}
.game.red{border-left-color:#FF6B6B}
.game.purple{border-left-color:#9B59B6}
.check{width:22px;height:22px;border:2px solid #ccc;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700;color:#0c2340;background:white;font-size:1em}
.game.picked .check{background:#0c2340;color:white;border:2px solid #0c2340}
.info{flex:1;min-width:0}
.rank{font-size:.8em;color:#999;font-weight:600}
.team{font-weight:700;font-size:1em;color:#333}
.date{font-size:.8em;color:#666;margin-top:2px}
.val{text-align:right;font-weight:700;color:#0c2340;min-width:45px;font-size:.95em}
.footer{background:white;padding:10px;display:flex;gap:8px;border-top:1px solid #ddd;flex-shrink:0}
.btn{flex:1;padding:10px;border:none;border-radius:6px;font-weight:600;cursor:pointer;font-size:.9em;text-transform:uppercase;touch-action:manipulation}
.btn-main{background:#0c2340;color:white}
.btn-main:active{background:#051829}
.btn-secondary{background:#e8e8e8;color:#333}
.btn-secondary:active{background:#d0d0d0}
.empty{text-align:center;padding:40px 20px;color:#999}
.empty-emoji{font-size:3em;margin-bottom:10px}
.empty h3{font-size:1.1em;margin-bottom:4px;color:#666}
</style>
</head>
<body>
<div class="app">
<div class="header">
<h1>🏀 DRAFT TRACKER</h1>
<div class="stats">
<div class="stat"><div class="stat-val" id="pickedCount">0</div><div class="stat-label">Picked</div></div>
<div class="stat"><div class="stat-val" id="remainCount">40</div><div class="stat-label">Remain</div></div>
<div class="stat"><div class="stat-val" id="donePercent">0%</div><div class="stat-label">Done</div></div>
</div>
</div>

<div class="tabs">
<button class="tab active" data-mode="remaining">Remaining</button>
<button class="tab" data-mode="picked">Picked</button>
</div>

<div class="list" id="gameList"></div>

<div class="footer">
<button class="btn btn-secondary" id="resetBtn">↻ Reset</button>
<button class="btn btn-main" id="statsBtn">📊 Stats</button>
</div>
</div>
