<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Celtics Draft</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; width: 100%; font-family: system-ui; background: #0c2340; }
.container { display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }
.header { background: linear-gradient(135deg, #0c2340 0%, #1a3a52 100%); color: white; padding: 15px; }
.header h1 { font-size: 1.2em; margin-bottom: 10px; }
.stats { display: flex; gap: 15px; background: rgba(255,255,255,.15); padding: 10px; border-radius: 6px; }
.stat { flex: 1; text-align: center; }
.stat-num { font-size: 1.1em; font-weight: 700; }
.tabs { display: flex; background: white; border-bottom: 1px solid #ddd; }
.tab-btn { flex: 1; padding: 12px; border: none; background: white; font-weight: 600; color: #666; border-bottom: 3px solid transparent; cursor: pointer; }
.tab-btn.active { color: #0c2340; border-bottom-color: #0c2340; background: #f5f5f5; }
.games { flex: 1; overflow-y: auto; padding: 8px; }
.game { background: white; padding: 12px; margin-bottom: 8px; border-radius: 8px; border-left: 4px solid #FFD700; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.game:active { opacity: 0.8; }
.game.picked { background: #e8e8e8; opacity: 0.6; }
.game.or { border-left-color: #FF8C00; }
.game.re { border-left-color: #FF6B6B; }
.game.pu { border-left-color: #9B59B6; }
.game.picked .info { text-decoration: line-through; color: #999; }
.check { width: 20px; height: 20px; border: 2px solid #ccc; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: white; font-weight: bold; }
.game.picked .check { background: #0c2340; color: white; }
.info { flex: 1; }
.rank { font-size: 0.75em; color: #999; }
.team { font-weight: 700; font-size: 0.95em; }
.date { font-size: 0.8em; color: #666; margin-top: 2px; }
.val { font-weight: 700; font-size: 0.9em; color: #0c2340; min-width: 40px; text-align: right; }
.footer { background: white; padding: 10px; display: flex; gap: 8px; border-top: 1px solid #ddd; }
.btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.9em; }
.btn-main { background: #0c2340; color: white; }
.btn-secondary { background: #e8e8e8; color: #333; }
.empty { text-align: center; padding: 60px 20px; color: #999; }
.empty-emoji { font-size: 3em; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>🏀 CELTICS DRAFT</h1>
<div class="stats">
<div class="stat"><div class="stat-num" id="picked">0</div>Picked</div>
<div class="stat"><div class="stat-num" id="remain">40</div>Remain</div>
<div class="stat"><div class="stat-num" id="pct">0%</div>Done</div>
</div>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('remaining')">Remaining</button>
<button class="tab-btn" onclick="switchTab('picked')">Picked</button>
</div>

<div class="games" id="gamesList"></div>

<div class="footer">
<button class="btn btn-secondary" onclick="doReset()">RESET</button>
<button class="btn btn-main" onclick="doStats()">STATS</button>
</div>

</div>

<script>
const games = [
{r:1,o:'PHI',d:'Jan 21',dy:'Thu',v:9.56,t:1},
{r:2,o:'PHI',d:'Mar 7',dy:'Sun',v:9.46,t:1},
{r:3,o:'OKC',d:'Mar 12',dy:'Fri',v:17.06,t:1},
{r:4,o:'NYK',d:'Oct 23',dy:'Fri',v:9.46,t:1},
{r:5,o:'SAS',d:'Mar 24',dy:'Wed',v:15.84,t:1},
{r:6,o:'MIA',d:'Dec 25',dy:'Fri',v:10.15,t:2},
{r:7,o:'MIN',d:'Feb 12',dy:'Fri',v:15.14,t:1},
{r:8,o:'HOU',d:'Jan 11',dy:'Mon',v:14.80,t:1},
{r:9,o:'GSW',d:'Feb 10',dy:'Wed',v:13.60,t:1},
{r:10,o:'DAL',d:'Nov 15',dy:'Sun',v:12.02,t:1},
{r:11,o:'LAL',d:'Feb 2',dy:'Tue',v:14.92,t:1},
{r:12,o:'DEN',d:'Feb 9',dy:'Tue',v:15.88,t:1},
{r:13,o:'DET',d:'Dec 20',dy:'Sun',v:8.18,t:1},
{r:14,o:'NYK',d:'Jan 13',dy:'Wed',v:8.56,t:1},
{r:15,o:'PHX',d:'Jan 29',dy:'Fri',v:13.65,t:2},
{r:16,o:'WAS',d:'Dec 14',dy:'Mon',v:7.68,t:1},
{r:17,o:'WAS',d:'Dec 16',dy:'Wed',v:7.28,t:1},
{r:18,o:'UTA',d:'Dec 18',dy:'Fri',v:12.55,t:2},
{r:19,o:'CLE',d:'Feb 26',dy:'Fri',v:10.30,t:2},
{r:20,o:'CHI',d:'Oct 30',dy:'Fri',v:13.88,t:3},
{r:21,o:'ATL',d:'Nov 27',dy:'Fri',v:13.88,t:3},
{r:22,o:'MIA',d:'Apr 2',dy:'Fri',v:10.15,t:2},
{r:23,o:'TOR',d:'Feb 14',dy:'Sun',v:10.88,t:4},
{r:24,o:'NOP',d:'Mar 21',dy:'Sun',v:13.22,t:3},
{r:25,o:'CHA',d:'Jan 23',dy:'Sat',v:12.00,t:4},
{r:26,o:'ORL',d:'Mar 18',dy:'Thu',v:9.10,t:2},
{r:27,o:'CLE',d:'Dec 28',dy:'Mon',v:9.05,t:1},
{r:28,o:'BKN',d:'Jan 16',dy:'Sat',v:12.00,t:4},
{r:29,o:'TOR',d:'Jan 25',dy:'Mon',v:7.92,t:1},
{r:30,o:'MEM',d:'Mar 11',dy:'Thu',v:11.00,t:4},
{r:31,o:'CHI',d:'Oct 26',dy:'Mon',v:11.38,t:4},
{r:32,o:'POR',d:'Dec 23',dy:'Wed',v:11.30,t:2},
{r:33,o:'IND',d:'Jan 20',dy:'Wed',v:7.65,t:2},
{r:34,o:'ORL',d:'Nov 16',dy:'Mon',v:8.60,t:2},
{r:35,o:'MIL',d:'Apr 11',dy:'Sun',v:10.50,t:4},
{r:36,o:'LAC',d:'Jan 27',dy:'Wed',v:10.24,t:3},
{r:37,o:'SAC',d:'Mar 16',dy:'Tue',v:9.00,t:4},
{r:38,o:'CHA',d:'Dec 2',dy:'Wed',v:8.00,t:4},
{r:39,o:'MIL',d:'Nov 4',dy:'Wed',v:8.00,t:4},
{r:40,o:'BKN',d:'Oct 27',dy:'Tue',v:9.00,t:4}
];

let pickedList = JSON.parse(localStorage.getItem('celticsPicked')) || [];
let currentView = 'remaining';

function tierClass(t) {
  if(t===1) return '';
  if(t===2) return 'or';
  if(t===3) return 're';
  return 'pu';
}

function clickGame(rank) {
  if(pickedList.includes(rank)) {
    pickedList = pickedList.filter(r => r !== rank);
  } else {
    pickedList.push(rank);
  }
  localStorage.setItem('celticsPicked', JSON.stringify(pickedList));
  showGames();
}

function showGames() {
  let html = '';
  let toShow = games;
  
  if(currentView === 'picked') {
    toShow = games.filter(g => pickedList.includes(g.r));
  } else {
    toShow = games.filter(g => !pickedList.includes(g.r));
  }
  
  if(toShow.length === 0) {
    html = `<div class="empty"><div class="empty-emoji">${currentView==='picked'?'🔍':'🎉'}</div><div>${currentView==='picked'?'No picks yet':'All picked!'}</div></div>`;
  } else {
    toShow.forEach(g => {
      let isPicked = pickedList.includes(g.r);
      let tc = tierClass(g.t);
      html += `<div class="game ${tc} ${isPicked?'picked':''}" onclick="clickGame(${g.r})">
        <div class="check">${isPicked?'✓':''}</div>
        <div class="info">
          <div class="rank">#${g.r}</div>
          <div class="team">${g.o}</div>
          <div class="date">${g.d} ${g.dy}</div>
        </div>
        <div class="val">${g.v}</div>
      </div>`;
    });
  }
  
  document.getElementById('gamesList').innerHTML = html;
  
  document.getElementById('picked').textContent = pickedList.length;
  document.getElementById('remain').textContent = 40 - pickedList.length;
  document.getElementById('pct').textContent = Math.round(pickedList.length/40*100) + '%';
}

function switchTab(view) {
  currentView = view;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  showGames();
}

function doReset() {
  if(pickedList.length > 0 && confirm('Reset all picks?')) {
    pickedList = [];
    localStorage.setItem('celticsPicked', JSON.stringify(pickedList));
    currentView = 'remaining';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    showGames();
  }
}

function doStats() {
  let total = 0;
  games.forEach(g => {
    if(pickedList.includes(g.r)) total += g.v;
  });
  let avg = pickedList.length > 0 ? (total/pickedList.length).toFixed(2) : 0;
  alert('📊 STATS\n\nPicked: ' + pickedList.length + '/40\nTotal: ' + total.toFixed(2) + '\nAvg: ' + avg);
}

showGames();
</script>

</body>
</html>
